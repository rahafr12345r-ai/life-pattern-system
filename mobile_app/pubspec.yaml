name: life_pattern_mobile
description: Life Pattern System Flutter mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies will be added in the Firebase and UI phases after the
# Flutter SDK is provisioned and the first phase is approved.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  health: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
